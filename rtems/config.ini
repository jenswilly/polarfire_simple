# RTEMS 6.2 BSP options, used by .devcontainer/scripts/post_configuration.sh.
# All options and their defaults: /opt/rtems/src/rtems/spec/build/bsps/
#
# The mpfs64imafdc defaults fit HSS + one U54: boot hart 1 (U54_1), RAM at
# 0x10_0000_0000 (cached DDR).
[riscv/mpfs64imafdc]
# Discovery Kit device tree (console on MMUART0), built from
# dts/mpfs-discovery-kit.dts by dts/build_dtb.sh
BSP_DTB_HEADER_PATH = /workspace/rtems/dts/mpfs-discovery-kit-dtb.h
# The BSP uses only the built-in device tree, so don't copy one from the
# address in a1 at start-up (the HSS doesn't pass one). Same as the
# riscv/beaglevfire BSP.
BSP_START_COPY_FDT_FROM_U_BOOT = False
